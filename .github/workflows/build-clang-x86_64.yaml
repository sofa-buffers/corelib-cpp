name: "Build: x86_64 (Clang)"

# Both configurations, as CORELIB_PLAN §12.1 requires — see the GCC workflow for
# why the Release leg is worth its runtime. `fail-fast: false` keeps one red leg
# from hiding the other's result.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang

      - name: Configure with CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build project
        run: cmake --build build --parallel "$(nproc)"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --verbose
