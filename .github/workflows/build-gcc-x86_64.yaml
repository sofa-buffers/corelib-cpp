name: "Build: x86_64 (GCC)"

# CORELIB_PLAN §12.1 requires both a debug and a release configuration to be
# built and tested: Release is -O3 -DNDEBUG, where strict-aliasing or UB in the
# varint window fast paths and optimiser-visible use of an uninitialised field
# first become observable. `fail-fast: false` keeps one red leg from hiding the
# other's result.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A superseded push must release its runner slots instead of queueing behind
# itself; on main we never cancel, so a push there keeps its full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung step must fail fast and name itself: only 20 Actions jobs can run
    # at once across this family, and a job left on the 360-minute default
    # holds one of those slots away from every other repo. The value below is
    # many times the observed runtime -- this job has never taken 1.5 min.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          # Transient apt mirror failures are the single most common way a
          # runner is lost here, so retry before giving up.
          for i in 1 2 3; do
            sudo apt-get update \
              && sudo apt-get install -y --no-install-recommends \
                   build-essential cmake \
              && exit 0
            echo "::warning::apt attempt $i failed, retrying in 15s"
            sleep 15
          done
          echo "::error::apt failed after 3 attempts"
          exit 1

      - name: Configure with CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build project
        run: cmake --build build --parallel "$(nproc)"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --verbose

      # Guard the non-strict UTF-8 build (SOFAB_STRICT_UTF8=0): it must still
      # compile, pass the positive vectors, and skip the invalid_utf8 group.
      - name: Configure (strict UTF-8 OFF)
        run: |
          cmake -S . -B build-utf8-off \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-DSOFAB_STRICT_UTF8=0"

      - name: Build project (strict UTF-8 OFF)
        run: cmake --build build-utf8-off --parallel "$(nproc)"

      - name: Run tests (strict UTF-8 OFF)
        working-directory: build-utf8-off
        run: ctest --output-on-failure --verbose
