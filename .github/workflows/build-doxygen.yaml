name: Doxygen

# Docs build on main only, as in every other corelib repo: a pull request that
# breaks the Doxygen build is caught by the main run right after the merge, and
# the PR run could never publish anything anyway.
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; don't cancel in-progress runs so a
# deploy that is already publishing is allowed to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake doxygen graphviz

      - name: Configure with CMake
        run: |
          cmake -S . -B build \
            -DSOFAB_ENABLE_DOXYGEN=ON

      - name: Build documentation
        run: cmake --build build --target doc

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html

  # Publish only on pushes to main; the guard is kept so the job stays correct
  # if the workflow ever gains another trigger.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
